# history limit in number of lines
set -g history-limit 100000

# allow terminal scrolling
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@'

# rename windows by whatever is running
set-window-option -g automatic-rename on
set-window-option -g allow-rename on

# per-pane titles showing current directory, styled to match nord status bar
set -g pane-border-status top
set -g pane-border-format "#[fg=brightblack] #{pane_current_path} #[default]"
set -g pane-active-border-style "bg=default,fg=blue"

# Set tmux's internal terminal type to support 256 colors
set -g default-terminal "xterm-256color"

# Enable italic support (Sitm capability)
set -as terminal-overrides ',*:Sitm=\E[3m'

# Enable true color (24-bit) support (Tc capability)
set -as terminal-overrides ',*:Tc'

# [linux] pass modified keys (e.g. Shift-Enter) through to apps that ask for them
# TODO: is this compatible with mac?
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# renumber windows automatically so they're always sequential
set-option -g renumber-windows on

set -g allow-passthrough on # notifications and progress
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# mouse
set -g mouse on

# splitting (use ctrl-B + h/v)
unbind %
unbind '"'

# open new splits/windows in current path
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# window switching +/-
unbind n
bind = next-window
bind - previous-window

# colon :
bind : command-prompt

#
# Info on left (I don't have a session display for now)
set -g status-left ''
set -g status-right ''

# loud or quiet?
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off


# (run after to override plugins)
# selection color = invert so I can actually see it
set-option -g mode-style "reverse"
set -g status-right-length 100
set -g status-left-length 100
set -g status-position bottom
set -g status-justify centre

run-shell "~/.tmux/themes/nord-tmux/nord.tmux"

# forward OSC 9;4 progress to Ghostty (no terminfo defines Spb, so declare it)
set -as terminal-features ",xterm-256color:progressbar"

#
# sessions & bell alerts (for juggling multiple claude sessions)
# (must stay after the nord theme so status-right isn't overwritten)
#

# prefix N: prompt for a name, create that session (or switch to it if it exists)
bind N command-prompt -p "new session:" "new-session -A -s '%%' -c '#{pane_current_path}'"

# prefix s: session picker, with 🔔 on sessions/windows that rang the bell
bind s choose-tree -Zs -F "#{?session_format,#{?session_alerts,🔔 ,}#{session_windows} windows#{?session_attached, (attached),},#{?window_bell_flag,🔔 ,}#{window_name}}"

# prefix S: fzf picker; enter on a match switches, enter on an unmatched name creates it
bind S display-popup -E -w 40% -h 50% -d "#{pane_current_path}" '\
  t=$(tmux ls -F "#S#{?session_alerts, 🔔,}" | fzf --reverse --bind enter:accept-or-print-query | sed "s/ 🔔$//"); \
  [ -n "$t" ] || exit 0; \
  tmux has -t "=$t" 2>/dev/null || tmux new -ds "$t" -c "$PWD"; \
  tmux switch -t "=$t"'

# bell flags are set on windows you're not looking at and cleared when you visit them
set -g monitor-bell on
set -g bell-action any
set -g window-status-bell-style "fg=black,bg=yellow"

# status bar: list every session with a pending bell
set -g status-right "#{S:#{?session_alerts,#[fg=black#,bg=yellow] 🔔 #S #[default] ,}}"
